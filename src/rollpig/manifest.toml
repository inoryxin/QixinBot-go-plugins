id = "rollpig"
name = "抽小猪"
version = "1.0.0"
apiVersion = "1.x"
exec = ["node", "app/index.js"]
description = "抽取属于你的小猪：今日小猪、随机小猪、找猪（PigHub 图库）"
priority = 10

[access]
require_prefix = false
require_mention = false

[[commands]]
id = "rollpig.today"
usage = "今日小猪"
aliases = ["今天小猪", "今日小猪@某人"]
description = "按人和日期抽一只固定的小猪"

[[commands]]
id = "rollpig.random"
usage = "随机小猪 [数量]"
description = "随机抽 1~10 只"

[[commands]]
id = "rollpig.search"
usage = "找猪 <关键词>"
description = "搜索小猪；找猪 -i <ID> 按 ID"

[[tools]]
name = "roll_pig"
description = "随机抽一只小猪图片。用户说「抽只小猪」「来只猪」时调用。"

[tools.parameters]
type = "object"
