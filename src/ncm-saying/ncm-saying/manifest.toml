id = "ncm-saying"
name = "网抑云"
version = "1.0.0"
apiVersion = "1.x"
exec = ["node", "app/index.js"]
description = "随机来一条网易云音乐热评"

concurrency = "session"

[[commands]]
id = "ncm.random"
usage = "网抑云"
description = "随机一条网易云音乐热评"

[[settings]]
key = "api_url"
label = "热评接口"
type = "string"
default = ""
hint = "留空用默认的 aa1.cn 接口"

[[settings]]
key = "hour"
label = "几点发（0-23）"
type = "number"
default = 0

[[settings]]
key = "minute"
label = "几分发（0-59）"
type = "number"
default = 0

[[settings]]
key = "auto_groups"
label = "自动发送的群号"
type = "string"
default = ""
hint = "多个群号用 | 或逗号或空格分隔都行；留空则不发"

[cooldown]
per_user = "3s"
