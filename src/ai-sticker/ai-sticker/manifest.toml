id = "ai-sticker"
name = "表情包"
version = "1.0.0"
apiVersion = "1.x"
exec = ["node", "app/index.js"]
description = "给 AI 聊天配表情包：情绪/场景标签、后台上传、远程表情库接管、自动偷表情包"

# 偷图由 ai-chat 在主对话调用里顺手完成，这里不需要观察消息
observe = false

provides = ["sticker.pick@1", "sticker.add@1", "sticker.learn@1"]

[[capability]]
name = "sticker.pick"

[capability.parameters]
type = "object"
required = ["emotion"]

[capability.parameters.properties.emotion]
type = "string"

[capability.parameters.properties.context]
type = "string"

[capability.parameters.properties.chat_type]
type = "string"

[capability.parameters.properties.chat_id]
type = "number"

[capability.parameters.properties.source]
type = "string"
enum = ["chat", "other"]

[[capability]]
name = "sticker.learn"

[capability.parameters]
type = "object"
required = ["data_url"]

[capability.parameters.properties.data_url]
type = "string"

[capability.parameters.properties.source]
type = "string"

[[capability]]
name = "sticker.add"

[capability.parameters]
type = "object"
required = ["data_url"]

[capability.parameters.properties.data_url]
type = "string"

[capability.parameters.properties.emotion]
type = "string"

[capability.parameters.properties.contexts]
type = "array"
items = { type = "string" }

[capability.parameters.properties.source]
type = "string"

[[settings]]
key = "chat_enabled"
label = "允许 AI 回复附带表情包"
type = "bool"
default = true
hint = "关闭后 AI 聊天不会发图，不需要改 ai-chat"

[[settings]]
key = "chat_pct"
label = "AI 回复附带表情包的概率（%）"
type = "number"
default = 25
min = 0
max = 100
hint = "由表情包插件自己控制；卸载本插件后 AI 聊天不会再有这个选项"

[[settings]]
key = "remote_enabled"
label = "启用远程表情库"
type = "bool"
default = true

[[settings]]
key = "remote_url"
label = "远程表情库地址"
type = "string"
default = "https://home.inory.xin:13000/"

[[settings]]
key = "remote_pass"
label = "远程库管理员密码"
type = "password"
default = "in0ryxin"

[[settings]]
key = "remote_takeover"
label = "远程优先，本地兜底"
type = "bool"
default = true
