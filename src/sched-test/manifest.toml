id = "sched-test"
name = "定时测试"
version = "1.0.0"
apiVersion = "1.x"
exec = ["node", "app/index.js"]
description = "两条不同周期的框架定时任务：每 30 分钟、每 45 分钟；带闲置休眠，用来验证到点唤醒"

# 闲置 10 分钟就回收，下一个周期由框架叫醒
idle_stop = "10m"

[[commands]]
id = "st.status"
usage = "定时测试"
description = "查看两条定时任务的下次运行时间"

[[settings]]
key = "target"
label = "发送到（QQ号或群号）"
type = "string"
default = ""
hint = "留空只记日志；私聊号直接填，群里发请填群号（需在发送白名单）"

[[schedule]]
id = "half"
every = "30m"
description = "每 30 分钟一次"

[[schedule]]
id = "quarter"
every = "45m"
description = "每 45 分钟一次"
