id = "blog"
name = "博客"
version = "1.0.0"
apiVersion = "1.x"
exec = ["node", "app/index.js"]
description = "Typecho 一键发博客：连续输入、图片上传、AI 生成、发布并同步 QQ 空间"
priority = 10
permissions = ["onebot.dangerous"]

[access]
require_prefix = false
require_mention = false

[[commands]]
id = "blog.start"
usage = "blog"
description = "开始一篇博客，下一条消息是标题"
aliases = ["博客"]
require_prefix = false

[[commands]]
id = "blog.new"
usage = "blog 新建"
description = "新建草稿（同 /blog 开始）"
require_prefix = false

[[commands]]
id = "blog.write"
usage = "blog 写 <主题>"
description = "让 AI 根据主题生成草稿"
require_prefix = false

[[commands]]
id = "blog.generate"
usage = "blog 生成 <主题>"
description = "同 /blog 写"
require_prefix = false

[[commands]]
id = "blog.summary"
usage = "blog 总结"
description = "让 AI 总结最近聊天生成博客草稿"
require_prefix = false

[[commands]]
id = "blog.send"
usage = "blog 发送"
description = "发布当前草稿到 Typecho"
require_prefix = false

[[commands]]
id = "blog.sync"
usage = "blog 发送同步"
description = "发布当前草稿并同步到 QQ 空间"
require_prefix = false

[[commands]]
id = "blog.cancel"
usage = "blog 取消"
description = "取消当前博客草稿"
require_prefix = false

[[commands]]
id = "blog.test"
usage = "blog 测试"
description = "测试 Typecho XML-RPC 连接"
require_prefix = false

[[commands]]
id = "blog.quick"
usage = "blog <标题> | <正文>"
description = "直接生成草稿（不发布）"
require_prefix = false

[[settings]]
key = "enabled"
label = "启用博客"
type = "bool"
default = true

[[settings]]
key = "baseUrl"
label = "Typecho 地址"
type = "string"
default = "https://home.inory.xin:20806"

[[settings]]
key = "username"
label = "Typecho 用户名"
type = "string"
default = "anzu"

[[settings]]
key = "password"
label = "Typecho 密码"
type = "password"
default = ""

[[settings]]
key = "category"
label = "默认分类"
type = "string"
default = ""

[[settings]]
key = "uploadToken"
label = "图片上传 Token"
type = "password"
default = "qixin-blog-upload-2026"

[[settings]]
key = "aiStyle"
label = "AI 写作风格"
type = "string"
default = "自然、简短、像个人博客"

[[settings]]
key = "ownerQQ"
label = "允许使用的 QQ"
type = "string"
default = ""
hint = "留空 = 使用框架 [owner] users（QIXIN_OWNER）"

[[tools]]
name = "publish_blog"
description = "发布一篇 Typecho 博客。"

[tools.parameters]
type = "object"
required = ["title", "content"]

[tools.parameters.properties.title]
type = "string"

[tools.parameters.properties.content]
type = "string"
