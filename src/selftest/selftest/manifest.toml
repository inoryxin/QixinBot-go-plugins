id = "selftest"
name = "自检"
version = "1.0.0"
apiVersion = "1.x"
exec = ["node", "app/index.js"]
web = "web/index.html"
use_tools = true

description = "覆盖框架全部能力的验收插件"

# 订阅非消息事件（只有声明的插件才会收到 handle_event）
events = ["*"]

permissions = ["onebot.write"]
uses = ["weather_query"]

[[commands]]
id = "selftest.echo"
usage = "selftest echo <文本>"
description = "原样返回参数，验证命令解析"

[[commands]]
id = "selftest.settings"
usage = "selftest settings"
description = "打印当前所有设置值"

[[commands]]
id = "selftest.store"
usage = "selftest store"
description = "自增私有计数器，验证存储持久化"

[[commands]]
id = "selftest.tool"
usage = "selftest tool"
description = "调用 weather_query 工具，验证插件互调"

[[commands]]
id = "selftest.events"
usage = "selftest events"
description = "显示最近收到的通知事件"

[[commands]]
id = "selftest.admin"
usage = "selftest admin"
description = "只有主人能用"
allow_users = [2849446053]

[[commands]]
id = "selftest.hidden"
usage = "selftest hidden"
description = "不在 help 里显示，但仍可执行"
hidden = true

[[tools]]
name = "selftest_echo"
description = "把输入原样返回，用于验证工具调用链路"
parameters = { type = "object", properties = { text = { type = "string", description = "要回显的文本" } }, required = ["text"] }

[[tools]]
name = "selftest_calc"
description = "四则运算，用于验证数字参数和枚举"
parameters = { type = "object", properties = { a = { type = "number" }, b = { type = "number" }, op = { type = "string", enum = ["add", "sub", "mul", "div"] } }, required = ["a", "b", "op"] }

[[settings]]
key = "text"
label = "文本"
type = "string"
default = "hello"

[[settings]]
key = "secret"
label = "密钥（不会回显）"
type = "password"
default = ""

[[settings]]
key = "count"
label = "数量"
type = "number"
min = 0
max = 100
default = 5

[[settings]]
key = "enabled"
label = "开关"
type = "boolean"
default = true

[[settings]]
key = "mode"
label = "模式"
type = "select"
options = ["fast", "normal", "slow"]
default = "normal"

[[settings]]
key = "workDir"
label = "工作目录"
type = "path"
default = ""

[[schedule]]
id = "heartbeat"
every = "10s"
description = "每 10 秒记一条日志，验证定时任务"
