<p class="muted">下面这些按钮直接调框架的工具接口，用于验证插件互调和跨插件调用。</p>
<div style="display:flex;gap:8px;flex-wrap:wrap;margin:12px 0">
  <button type="button" onclick="stCall('selftest_echo', {text:'来自设置页'})">调 selftest_echo</button>
  <button type="button" onclick="stCall('selftest_calc', {a:6,b:7,op:'mul'})">调 selftest_calc</button>
  <button type="button" onclick="stCall('weather_query', {city:'上海'})">跨插件调 weather_query</button>
</div>
<pre id="st-out" style="display:none;background:#1e1e1e;color:#ddd;padding:12px;border-radius:6px;font-size:12px;overflow:auto;max-height:240px"></pre>
<script>
async function stCall(name, args) {
  const out = document.getElementById('st-out');
  out.style.display = 'block';
  out.textContent = '调用 ' + name + ' …';
  const body = new URLSearchParams({ name, args: JSON.stringify(args) });
  try {
    const r = await fetch('/api/tools/call', { method: 'POST', body });
    out.textContent = JSON.stringify(await r.json(), null, 2);
  } catch (e) {
    out.textContent = '失败：' + e.message;
  }
}
</script>
