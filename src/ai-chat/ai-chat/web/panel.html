<!-- AI 聊天的扩展面板：key 说明 + 人设管理 -->
<div style="margin-top:12px;padding:12px 14px;border:1px solid var(--border);border-radius:8px;background:var(--hover)">
  <p style="margin:0 0 8px 0"><strong>这个插件本身不存 API Key。</strong></p>
  <p class="muted" style="margin:0 0 6px 0">
    它通过能力 <code>llm.chat</code> 调用 LLM，Key 配置在
    <a href="/plugin/llm/">LLM 服务</a> 插件的设置页里。
  </p>
  <p class="muted" style="margin:0 0 6px 0">
    DeepSeek 的填法：地址 <code>https://api.deepseek.com/v1</code>，模型 <code>deepseek-chat</code>。
  </p>
  <p class="muted" style="margin:0">
    记忆存在 <code>db.sqlite</code>（SQLite 存储插件），人设切换走 <code>ai.persona</code> 能力。
  </p>
</div>

<!-- 人设管理：走 ai.persona 能力，不占用框架页面 -->
<h2 style="margin-top:22px">人设</h2>
<p class="muted" style="margin:0 0 10px">
  群聊和私聊各自独立，改完立刻生效（下一条回复就用）。
</p>

<div style="display:flex;gap:14px;align-items:flex-start">
  <div style="flex:0 0 200px">
    <table><thead><tr><th>人设</th></tr></thead><tbody id="plist"></tbody></table>
    <div class="form-box" style="margin-top:10px">
      <label>新建</label>
      <input type="text" id="pname" placeholder="名字，例如 猫娘">
      <label style="margin-top:8px">描述</label>
      <textarea id="pcontent" rows="3" placeholder="你是猫娘，说话带喵…"></textarea>
      <div style="margin-top:10px"><button class="primary" onclick="pSaveNew()">创建</button></div>
    </div>
  </div>

  <div style="flex:1 1 auto;min-width:280px">
    <div class="form-box" id="pedit" style="display:none">
      <label>人设名</label>
      <div><code id="pname-view"></code></div>
      <label style="margin-top:10px">描述（会拼进 system prompt）</label>
      <textarea id="pedit-content" rows="8"></textarea>
      <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">
        <button class="primary" onclick="pSaveEdit()">保存</button>
        <button onclick="pSwitch('group')">设为本群</button>
        <button onclick="pSwitch('private')">设为私聊</button>
        <button class="danger" onclick="pDelete()">删除</button>
      </div>
    </div>
    <div class="notice" id="pempty">左边点一个人设来编辑，或者新建一个。</div>
    <div id="pmsg" class="notice" style="display:none"></div>
  </div>
</div>

<script>
(function(){
  let current = { group: '', private: '', list: [] }
  let editing = ''

  function $(id){ return document.getElementById(id) }
  function msg(t){ const m=$('pmsg'); m.textContent=t; m.style.display='block' }

  // 调框架通用的能力入口；人设的所有操作都经过插件
  async function call(action, extra){
    const body = new FormData()
    body.set('name', 'ai.persona')
    body.set('args', JSON.stringify(Object.assign({ action }, extra || {})))
    const r = await fetch('/api/capabilities/call', { method: 'POST', body })
    const j = await r.json()
    if (!j.ok) throw new Error(j.error || '调用失败')
    const inner = j.result || {}
    if (inner.ok === false) throw new Error(inner.error || '插件返回失败')
    return inner.data || {}
  }

  async function load(){
    try {
      const d = await call('list')
      current = { group: d.group || '', private: d.private || '', list: d.personas || [] }
      const tb = $('plist'); tb.innerHTML = ''
      for (const name of current.list){
        const tr = document.createElement('tr')
        const td = document.createElement('td')
        const a = document.createElement('a')
        a.href = '#'; a.textContent = name
        a.onclick = (e) => { e.preventDefault(); open(name) }
        td.appendChild(a)
        if (name === current.group) td.insertAdjacentHTML('beforeend', ' <span class="tag">群</span>')
        if (name === current.private) td.insertAdjacentHTML('beforeend', ' <span class="tag">私</span>')
        tr.appendChild(td); tb.appendChild(tr)
      }
    } catch (e) { msg('读取失败：' + e.message) }
  }

  async function open(name){
    try {
      const d = await call('get', { name })
      editing = name
      $('pname-view').textContent = name
      $('pedit-content').value = d.content || ''
      $('pedit').style.display = 'block'
      $('pempty').style.display = 'none'
    } catch (e) { msg('打开失败：' + e.message) }
  }

  window.pSaveNew = async function(){
    const name = $('pname').value.trim()
    const content = $('pcontent').value.trim()
    if (!name) return msg('名字不能为空')
    if (!content) return msg('描述不能为空')
    try {
      await call('save', { name, content })
      $('pname').value = ''; $('pcontent').value = ''
      msg('已创建「' + name + '」')
      await load(); await open(name)
    } catch (e) { msg('创建失败：' + e.message) }
  }

  window.pSaveEdit = async function(){
    if (!editing) return
    try {
      await call('save', { name: editing, content: $('pedit-content').value.trim() })
      msg('已保存「' + editing + '」')
      await load()
    } catch (e) { msg('保存失败：' + e.message) }
  }

  window.pSwitch = async function(scope){
    if (!editing) return
    try {
      await call('set', { name: editing, scope })
      msg((scope === 'group' ? '本群' : '私聊') + '已切换到「' + editing + '」')
      await load()
    } catch (e) { msg('切换失败：' + e.message) }
  }

  window.pDelete = async function(){
    if (!editing) return
    if (!confirm('删除人设「' + editing + '」？')) return
    try {
      await call('delete', { name: editing })
      msg('已删除「' + editing + '」')
      editing = ''
      $('pedit').style.display = 'none'
      $('pempty').style.display = 'block'
      await load()
    } catch (e) { msg('删除失败：' + e.message) }
  }

  load()
})()
</script>
