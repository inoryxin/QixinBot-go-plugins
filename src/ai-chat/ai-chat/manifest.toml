id = "ai-chat"
name = "AI 聊天"
version = "1.0.0"
apiVersion = "1.x"
exec = ["node", "app/index.js"]
description = "会记住每个人的对话，支持人设切换、概率回复和主动发言"

permissions = ["onebot.write"]

# 兜底插件：其他插件都不接的消息才轮到它
last = true

# 同一会话串行，不同会话并发（几十个群同时聊不排队）
concurrency = "session"

# 声明要用工具（AI 工具面板出现在插件详情页）
use_tools = true

provides = ["ai.chat@1", "ai.persona@1"]

# AI 聊天要接普通消息，不能要求命令前缀。
# 这是最容易漏的一条：默认 require_prefix = true，普通消息会被静默拦掉。
[access]
require_prefix = false
require_mention = false

# LLM 还是要插件提供（框架不内置模型调用）
[[requires]]
name = "LLM 服务"
kind = "plugin"
value = "llm"

# 数据库能力由框架内置提供（db.sqlite），不再依赖 sqlite 插件

# 好感度是可选依赖：装了就用，没装不影响聊天
# [[requires]]
# name = "好感度"
# kind = "plugin"
# value = "affinity"

# ---- 能力：别的插件让它说话 ----
[[capability]]
name = "ai.chat"

[capability.parameters]
type = "object"
required = ["text"]

[capability.parameters.properties.text]
type = "string"

[capability.parameters.properties.chat_type]
type = "string"

[capability.parameters.properties.chat_id]
type = "number"

[capability.parameters.properties.prompt]
type = "string"

[capability.parameters.properties.user_id]
type = "number"

[capability.parameters.properties.nickname]
type = "string"

[capability.parameters.properties.account]
type = "string"

[capability.parameters.properties.images]
type = "array"

# ---- 能力：人设切换 ----
[[capability]]
name = "ai.persona"

[capability.parameters]
type = "object"
required = ["action"]

[capability.parameters.properties.action]
type = "string"

[capability.parameters.properties.name]
type = "string"

[capability.parameters.properties.content]
type = "string"

# 切换人设时要指定作用域：群聊还是私聊。
# 漏了这个字段，框架的参数校验会直接拒掉调用
# （"未知参数 scope（允许: action content name）"）。
[capability.parameters.properties.scope]
type = "string"
enum = ["group", "private"]

# ---- 设置 ----
# ---- 人设管理 ----
[[commands]]
id = "ai.persona.list"
usage = "人设"
description = "查看当前人设和全部人设"

[[commands]]
id = "ai.persona.use"
usage = "人设 切换 <名字>"
description = "本群/本私聊切换到指定人设"
require_role = "admin"

[[commands]]
id = "ai.persona.new"
usage = "人设 新建 <名字> <描述>"
description = "新建一个人设（也用于修改已有）"
require_role = "admin"

[[commands]]
id = "ai.persona.del"
usage = "人设 删除 <名字>"
description = "删除一个人设"
require_role = "owner"

[[settings]]
key = "trigger_mode"
label = "触发方式"
type = "select"
options = ["mention", "always", "prob"]
default = "mention"
help = "mention=只在@时回复；always=每条都回；prob=按概率"

[[settings]]
key = "trigger_prob"
label = "普通消息触发概率（%）"
type = "number"
default = 5
min = 0
max = 100

[[settings]]
key = "cooldown"
label = "同一会话冷却（秒）"
type = "number"
default = 30
min = 0
max = 3600

[[settings]]
key = "memory_limit"
label = "每会话保留消息数"
type = "number"
default = 1000
min = 50
max = 5000

[[settings]]
key = "context_size"
label = "送进模型的上下文条数"
type = "number"
default = 20
min = 4
max = 100

[[settings]]
key = "system_prompt"
label = "系统提示词"
type = "string"
default = "你是一个群聊里的朋友，说话自然、简短、口语化。不要用列表和标题，不要说自己是大模型。"

[[settings]]
key = "bot_name"
label = "机器人自称"
type = "string"
default = ""

[[settings]]
key = "personal_memory"
label = "个人记忆条数（跨群）"
type = "number"
default = 200
min = 0
max = 2000

[[settings]]
key = "use_affinity"
label = "接入好感度"
type = "boolean"
default = true

[[settings]]
key = "reply_typing"
label = "模拟打字延迟（毫秒）"
type = "number"
default = 300
min = 0
max = 5000

# ---- 共享数据：人设 ----
[[shared]]
key = "persona_group"
description = "群聊人设名"
default = "群聊"

[[shared]]
key = "persona_private"
description = "私聊人设名"
default = "私聊"

[[shared]]
key = "speaking_style"
description = "语气风格描述"
default = "正常"

# 运行环境放最后（TOML 表规则：后面的 key 属于最近的表）
[runtime]
kind = "node"
version = ">=18"
