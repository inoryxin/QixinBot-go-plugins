id = "ai-chat"
name = "AI 聊天"
version = "1.0.0"
apiVersion = "1.x"
exec = ["node", "app/index.js"]
description = "会记住每个人的对话；人设由 ai-persona 插件提供，没装时用内置的"

permissions = ["onebot.write"]

# 兜底插件：其他插件都不接的消息才轮到它
last = true

# 同一会话串行，不同会话并发（几十个群同时聊不排队）
concurrency = "session"

# 声明要用工具（AI 工具面板出现在插件详情页）
use_tools = true

provides = ["ai.chat@1", "ai.learn@1"]

# AI 聊天要接普通消息，不能要求命令前缀。
# 这是最容易漏的一条：默认 require_prefix = true，普通消息会被静默拦掉。
[access]
require_prefix = false
require_mention = false

# LLM 还是要插件提供（框架不内置模型调用）
[[requires]]
name = "LLM 服务"
kind = "plugin"
value = "llm"

# 数据库能力由框架内置提供（db.sqlite），不再依赖 sqlite 插件

# 好感度是可选依赖：装了就用，没装不影响聊天
# [[requires]]
# name = "好感度"
# kind = "plugin"
# value = "affinity"

# ---- 能力：别的插件让它说话 ----
[[capability]]
name = "ai.chat"

[capability.parameters]
type = "object"
required = ["text"]

[capability.parameters.properties.text]
type = "string"

[capability.parameters.properties.chat_type]
type = "string"

[capability.parameters.properties.chat_id]
type = "number"

[capability.parameters.properties.prompt]
type = "string"

[capability.parameters.properties.user_id]
type = "number"

[capability.parameters.properties.nickname]
type = "string"

[capability.parameters.properties.account]
type = "string"

[capability.parameters.properties.images]
type = "array"

# ---- 能力：人设切换 ----

# ---- 语气 / 群黑话 ----
[[commands]]
id = "ai.style"
usage = "语气"
description = "看看我从这个群和你身上学到了什么说话习惯"

[[commands]]
id = "ai.slang"
usage = "黑话"
description = "看这个群学到的高频词和已录入的黑话含义"

[[commands]]
id = "ai.slang.add"
usage = "黑话 加 <词> <含义>"
description = "教机器人一个群黑话的意思"
require_role = "admin"

[[commands]]
id = "ai.slang.del"
usage = "黑话 删 <词>"
description = "删掉一个黑话词条"
require_role = "admin"

[[capability]]
name = "ai.learn"

[capability.parameters]
type = "object"
required = ["action"]

# 动作：groups（哪些群有语料）/ stats（某群学到了什么）
#       ban / unban（屏蔽或恢复一个自动学到的词）
#       gloss_add / gloss_delete（人工词条）
[capability.parameters.properties.action]
type = "string"
enum = ["groups", "stats", "ban", "unban", "gloss_add", "gloss_delete", "forget"]

[capability.parameters.properties.chat_type]
type = "string"

[capability.parameters.properties.chat_id]
type = "number"

[capability.parameters.properties.term]
type = "string"

# ---- 内置人设（装了 ai-persona 插件时自动让位）----
# hidden = true：不和 ai-persona 的命令在 /help 里重复显示
[[commands]]
id = "ai.persona.list"
usage = "人设"
description = "查看当前人设（内置实现，装 ai-persona 插件后由它接管）"
hidden = true

[[commands]]
id = "ai.persona.use"
usage = "人设 切换 <名字>"
description = "本群/本私聊切换到指定人设（内置实现）"
require_role = "admin"
hidden = true

[[commands]]
id = "ai.persona.new"
usage = "人设 新建 <名字> <描述>"
description = "新建或修改一个人设（内置实现）"
require_role = "admin"
hidden = true

[[commands]]
id = "ai.persona.del"
usage = "人设 删除 <名字>"
description = "删除一个人设（内置实现）"
require_role = "owner"
hidden = true

[[settings]]
key = "system_prompt"
label = "系统提示词（内置人设）"
type = "text"
default = "你是一个群聊里的朋友，说话自然、简短、口语化。不要用列表和标题，不要说自己是 AI。"
hint = "装了 ai-persona 插件时以那边的为准"

[[settings]]
key = "bot_name"
label = "机器人自称"
type = "string"
default = ""

[[settings]]
key = "speaking_style"
label = "说话风格补充"
type = "text"
default = ""

[[settings]]
key = "trigger_mode"
label = "触发方式"
type = "select"
options = ["mention", "always", "prob"]
default = "mention"
help = "mention=只在@时回复；always=每条都回；prob=按概率"

[[settings]]
key = "trigger_prob"
label = "普通消息触发概率（%）"
type = "number"
default = 5
min = 0
max = 100

[[settings]]
key = "cooldown"
label = "同一会话冷却（秒）"
type = "number"
default = 30
min = 0
max = 3600

[[settings]]
key = "memory_limit"
label = "每会话保留消息数"
type = "number"
default = 1000
min = 50
max = 5000

[[settings]]
key = "context_size"
label = "送进模型的上下文条数"
type = "number"
default = 20
min = 4
max = 100

[[settings]]
key = "personal_memory"
label = "个人记忆条数（跨群）"
type = "number"
default = 200
min = 0
max = 2000

[[settings]]
key = "use_affinity"
label = "接入好感度"
type = "boolean"
default = true

[[settings]]
key = "reply_typing"
label = "模拟打字延迟（毫秒）"
type = "number"
default = 300
min = 0
max = 5000

# ---- 共享数据：人设 ----
[runtime]
kind = "node"
version = ">=18"
