id = "ai-chat"
name = "AI 聊天"
version = "1.0.0"
apiVersion = "1.x"
exec = ["node", "app/index.js"]
description = "会记住每个人的对话；人设由 ai-persona 插件提供，没装时用内置的"

permissions = ["onebot.write"]

# 兜底插件：其他插件都不接的消息才轮到它
last = true

# 同一会话串行，不同会话并发（几十个群同时聊不排队）
concurrency = "session"

# 声明要用工具（AI 工具面板出现在插件详情页）
use_tools = true

# 所有消息都抄我一份（别人认领的也要）：记忆靠这个
observe = true

provides = ["ai.chat@1", "ai.learn@1", "ai.memory@1"]

# AI 聊天要接普通消息，不能要求命令前缀。
# 这是最容易漏的一条：默认 require_prefix = true，普通消息会被静默拦掉。
[access]
require_prefix = false
require_mention = false

# LLM 还是要插件提供（框架不内置模型调用）
[[requires]]
name = "LLM 服务"
kind = "plugin"
value = "ai-llm"

# 数据库能力由框架内置提供（db.sqlite），不再依赖 sqlite 插件

# 好感度是可选依赖：装了就用，没装不影响聊天
# [[requires]]
# name = "好感度"
# kind = "plugin"
# value = "ai-affinity"

# ---- 能力：别的插件让它说话 ----
[[capability]]
name = "ai.chat"

[capability.parameters]
type = "object"
required = ["text"]

[capability.parameters.properties.text]
type = "string"

[capability.parameters.properties.chat_type]
type = "string"

[capability.parameters.properties.chat_id]
type = "number"

[capability.parameters.properties.prompt]
type = "string"

[capability.parameters.properties.user_id]
type = "number"

[capability.parameters.properties.nickname]
type = "string"

[capability.parameters.properties.account]
type = "string"

[capability.parameters.properties.images]
type = "array"

# ---- 能力：人设切换 ----

# ---- 语气 / 群黑话 ----
[[commands]]
id = "ai.style"
usage = "语气"
description = "看看我从这个群和你身上学到了什么说话习惯"

[[commands]]
id = "ai.slang"
usage = "黑话"
description = "看这个群学到的高频词和已录入的黑话含义"

[[commands]]
id = "ai.slang.add"
usage = "黑话 加 <词> <含义>"
description = "教机器人一个群黑话的意思"
require_role = "admin"

[[commands]]
id = "ai.slang.del"
usage = "黑话 删 <词>"
description = "删掉一个黑话词条"
require_role = "admin"

[[capability]]
name = "ai.learn"

[capability.parameters]
type = "object"
required = ["action"]

# 动作：groups（哪些群有语料）/ stats（某群学到了什么）
#       ban / unban（屏蔽或恢复一个自动学到的词）
#       gloss_add / gloss_delete（人工词条）
[capability.parameters.properties.action]
type = "string"
enum = ["groups", "stats", "ban", "unban", "gloss_add", "gloss_delete", "forget"]

[capability.parameters.properties.chat_type]
type = "string"

[capability.parameters.properties.chat_id]
type = "number"

[capability.parameters.properties.term]
type = "string"

[capability.parameters.properties.meaning]
type = "string"

# ---- 内置人设（装了 ai-persona 插件时自动让位）----
# hidden = true：不和 ai-persona 的命令在 /help 里重复显示
[[commands]]
id = "ai.persona.list"
usage = "人设"
description = "查看当前人设（内置实现，装 ai-persona 插件后由它接管）"
hidden = true

[[commands]]
id = "ai.persona.use"
usage = "人设 切换 <名字>"
description = "本群/本私聊切换到指定人设（内置实现）"
require_role = "admin"
hidden = true

[[commands]]
id = "ai.persona.new"
usage = "人设 新建 <名字> <描述>"
description = "新建或修改一个人设（内置实现）"
require_role = "admin"
hidden = true

[[commands]]
id = "ai.persona.del"
usage = "人设 删除 <名字>"
description = "删除一个人设（内置实现）"
require_role = "owner"
hidden = true

# 内置人设用到的共享键（完整 key = ai-chat.persona_group）
[[shared]]
key = "persona_group"
description = "本群当前人设名（内置实现）"
default = "群聊"

[[shared]]
key = "persona_private"
description = "私聊当前人设名（内置实现）"
default = "私聊"

[[capability]]
name = "ai.memory"

[capability.parameters]
type = "object"
required = ["action"]

# groups: 有哪些会话 / recent: 最近消息 / delete: 删一条 / clear: 清空会话
# clear_kw: 按关键词删
[capability.parameters.properties.action]
type = "string"
enum = ["groups", "recent", "delete", "clear", "clear_kw"]

[capability.parameters.properties.chat_type]
type = "string"

[capability.parameters.properties.chat_id]
type = "number"

[capability.parameters.properties.id]
type = "number"

[capability.parameters.properties.limit]
type = "number"

[capability.parameters.properties.keyword]
type = "string"

[[commands]]
id = "ai.memory"
usage = "记忆"
description = "看/清空这个会话的聊天记忆（清空需要管理员）"

[[settings]]
key = "system_prompt"
label = "系统提示词（内置人设）"
type = "text"
default = "你是一个群聊里的朋友，说话自然、简短、口语化。不要用列表和标题，不要说自己是 AI。"
hint = "装了 ai-persona 插件时以那边的为准"

[[settings]]
key = "bot_name"
label = "机器人自称"
type = "string"
default = ""

[[settings]]
key = "speaking_style"
label = "说话风格补充"
type = "text"
default = ""

# @ 和插话是**两件独立的事**：@ 必回，插话是随机水群
[[settings]]
key = "reply_on_mention"
label = "被@时必须回复"
type = "bool"
default = true

[[settings]]
key = "group_chance_pct"
label = "群聊随机插话概率（%）"
type = "number"
default = 0
hint = "0 = 不插话；20 = 每 100 条普通消息里大约搭 20 次话"

[[settings]]
key = "cooldown"
label = "同一会话冷却（秒）"
type = "number"
default = 30
min = 0
max = 3600

[[settings]]
key = "memory_limit"
label = "每会话保留消息数"
type = "number"
default = 1000
min = 50
max = 5000

[[settings]]
key = "context_size"
label = "送进模型的上下文条数"
type = "number"
default = 20
min = 4
max = 100

[[settings]]
key = "personal_memory"
label = "个人记忆上限（条，多了不存）"
type = "number"
default = 500
min = 0
max = 2000

[[settings]]
key = "memory_base"
label = "平常聊天带几条记忆"
type = "number"
default = 3

[[settings]]
key = "memory_max"
label = "聊到相关话题最多带几条"
type = "number"
default = 15

[[settings]]
key = "use_affinity"
label = "接入好感度"
type = "boolean"
default = true

[[settings]]
key = "voice_reply"
label = "允许语音回复"
type = "bool"
default = false
hint = "需要装「发语音」插件（ai-voice）"

[[settings]]
key = "voice_prob_pct"
label = "语音回复的概率（%）"
type = "number"
default = 50
hint = "0 = 只发文字；100 = 每条都语音"

[[settings]]
key = "split_enabled"
label = "分段发送（像真人一句一句发）"
type = "bool"
default = true

[[settings]]
key = "split_max_chars"
label = "每段最多多少字"
type = "number"
default = 30

[[settings]]
key = "split_delay_ms"
label = "段与段之间停顿（毫秒）"
type = "number"
default = 500

# 分成几条的概率（相对权重，不用凑满 100）
[[settings]]
key = "split_pct_1"
label = "发 1 条的概率"
type = "number"
default = 20

[[settings]]
key = "split_pct_2"
label = "发 2 条的概率"
type = "number"
default = 40

[[settings]]
key = "split_pct_3"
label = "发 3 条的概率"
type = "number"
default = 25

[[settings]]
key = "split_pct_4"
label = "发 4 条的概率"
type = "number"
default = 10

[[settings]]
key = "split_pct_5"
label = "发 5 条的概率"
type = "number"
default = 5

[[settings]]
key = "reply_typing"
label = "模拟打字延迟（毫秒）"
type = "number"
default = 300
min = 0
max = 5000

# ---- 共享数据：人设 ----
[runtime]
kind = "node"
version = ">=18"
