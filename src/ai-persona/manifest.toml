id = "ai-persona"
name = "人设"
version = "1.1.1"
apiVersion = "1.x"
exec = ["node", "app/index.js"]
description = "管 AI 的系统提示词和人设：说谁、怎么说话、群聊/私聊各用哪套；含贴吧鱼模式（按群开关，切换后改用吧友口吻 + 语料库抽样）"

# 不是 service：它要接 /人设 命令。
# （service 插件在分发时被直接跳过，只能被别的插件调能力）
provides = ["persona.render@1", "persona.manage@1", "persona.mode@1"]

[[capability]]
name = "persona.render"
description = "按当前会话拼好系统提示词（AI 聊天插件调用）"

[capability.parameters]
type = "object"

[capability.parameters.properties.chat_type]
type = "string"

[capability.parameters.properties.chat_id]
type = "number"

[[capability]]
name = "persona.mode"
description = "查当前会话的额外模式状态（贴吧鱼模式开没开），ai-chat 用它决定要不要写记忆"

[capability.parameters]
type = "object"

[capability.parameters.properties.chat_type]
type = "string"

[capability.parameters.properties.chat_id]
type = "number"

[[capability]]
name = "persona.manage"
description = "人设的增删改查（控制台面板调用）"

[capability.parameters]
type = "object"
required = ["action"]

[capability.parameters.properties.action]
type = "string"
enum = ["list", "get", "save", "delete", "set", "style"]

[capability.parameters.properties.name]
type = "string"

[capability.parameters.properties.content]
type = "string"

[capability.parameters.properties.scope]
type = "string"
enum = ["group", "private"]

# ---- 人设管理命令 ----
# 它是 AI 聊天的扩展：没有主插件就没有意义
[[requires]]
kind = "plugin"
name = "AI 聊天"
value = "ai-chat"

[[tools]]
name = "tieba_add"
description = "把一条贴吧（百度贴吧）的吧友用语/句式/梗记进语料库，贴吧鱼模式每轮会抽样使用。聊天里看到好用的说法、或群友让你记一句时调用。"
parameters = { type = "object", properties = { phrase = { type = "string", description = "词或句式本体，例：绷不住了 / 建议直接 + 动词" }, kind = { type = "string", enum = ["slang", "pattern", "reply", "meme"], description = "slang=口癖/立场词，pattern=句式，reply=接话，meme=经典梗" }, meaning = { type = "string", description = "什么时候用、什么语气（不直接发出去）" }, bar = { type = "string", description = "出处吧名，例：孙笑川吧、李毅吧" }, example = { type = "string", description = "一句真实语感的例句" } }, required = ["phrase"] }

[[tools]]
name = "tieba_stats"
description = "看贴吧语料库里有多少条、各类各几条、出处分布，以及当前会话是否开着贴吧鱼模式。群友问「贴吧语料有多少」时调用。"
parameters = { type = "object", properties = { sample = { type = "number", description = "顺带抽几条示例（默认 5）" } } }

[access]
# 贴吧模式要认「@我 切换贴吧鱼模式」这种自然语言，不能强制前缀。
# 代价是每条消息都会进 handle_message，所以里面只做字符串判断就立刻 return。
require_prefix = false
require_mention = false

[[commands]]
id = "tieba.status"
usage = "贴吧"
description = "查看贴吧鱼模式状态；贴吧 开 / 贴吧 关"

[[commands]]
id = "persona.list"
usage = "人设"
description = "查看当前人设和全部人设"

[[commands]]
id = "persona.use"
usage = "人设 切换 <名字>"
description = "本群/本私聊切换到指定人设"
require_role = "admin"

[[commands]]
id = "persona.new"
usage = "人设 新建 <名字> <描述>"
description = "新建或修改一个人设"
require_role = "admin"

[[commands]]
id = "persona.del"
usage = "人设 删除 <名字>"
description = "删除一个人设"
require_role = "owner"

# 声明后才能写：完整 key = ai-persona.current_group
[[shared]]
key = "current_group"
description = "本群当前人设名"
default = "群聊"

[[shared]]
key = "current_private"
description = "私聊当前人设名"
default = "私聊"

# 按会话的覆盖：JSON 字符串 {"group:523507256":"猫娘"}
# 面板设的是默认，群里 /人设 切换 才写这里
[[shared]]
key = "per_chat"
description = "按会话覆盖的人设（JSON）"
default = "{}"

[[shared]]
key = "style_override"
description = "临时说话风格（能力 set_style 用）"
default = ""

[[settings]]
key = "system_prompt"
label = "基础提示词（所有人设共用）"
type = "text"
default = "你是一个群聊里的朋友，说话自然、简短、口语化。像手机聊天：短句，不用句号，用空格或换行断开。不要用列表和标题，不要说自己是 AI。"
hint = "所有场景、所有人设都先吃这段；具体人设在下面「人设列表」里选"

[[settings]]
key = "bot_name"
label = "机器人自称（共用）"
type = "string"
default = ""

[[settings]]
key = "speaking_style"
label = "说话风格补充（共用）"
type = "text"
default = ""
hint = "可留空。这部分对所有人设都生效"

# ---- 贴吧鱼模式（融合自 tieba-mouth 1.1.0）----
[[settings]]
key = "tieba_enabled"
label = "启用贴吧鱼模式"
type = "boolean"
default = true
hint = "关掉后不再认切换指令，已开着的会话也立刻恢复原人设"

[[settings]]
key = "tieba_identity"
label = "带上身份定位（见人就骂那套）"
type = "boolean"
default = true
hint = "关掉只保留原来的嘴臭腔调，不注入身份定位/对线技能"

[[settings]]
key = "tieba_require_mention"
label = "群里必须 @ 才认切换指令"
type = "boolean"
default = true
hint = "关掉后只要文字匹配就切；/贴吧 开 这种显式命令不受影响"

[[settings]]
key = "tieba_sample_count"
label = "每轮抽几条贴吧语料"
type = "number"
default = 6
min = 2
max = 20
hint = "太多会显得用力过猛"

[[settings]]
key = "tieba_rotate_minutes"
label = "换一批语料的间隔（分钟）"
type = "number"
default = 3
min = 1
max = 60

[[settings]]
key = "tieba_blocked_words"
label = "不想被抽到的语料"
type = "string"
default = ""
hint = "逗号或空格隔开，命中的语料不会被抽进提示词"
